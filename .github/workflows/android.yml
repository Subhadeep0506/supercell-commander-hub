name: Android APK

# Builds an installable APK and attaches it to the run, so it can be
# sideloaded and tested on a phone. On mobile data the app reaches the
# RoyaleAPI proxies directly, which is the point: the corporate network this
# is developed on blocks two of the three hosts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        default: release
        options: [release, debug]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # React Native 0.88 targets JDK 17; Gradle 9.4 accepts it.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The New Architecture compiles C++ for the codegen'd modules, so the
      # exact NDK named in android/build.gradle has to be present.
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      # keys.ts is generated, never committed: the tokens would otherwise be
      # readable in the repo. They are still extractable from the APK itself --
      # unavoidable without a backend, and accepted when this was planned.
      - name: Generate API key module
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
        run: |
          {
            echo "COC_API_KEY=${COC_API_KEY}"
            echo "CR_API_KEY=${CR_API_KEY}"
            echo "BS_API_KEY=${BS_API_KEY}"
          } > .env
          bun run keys

      - name: Verify bundled artwork is present
        run: |
          # The asset pipeline cannot run here -- its 185 MB of fan-kit packs
          # are not in the repo -- so the committed output must be intact or
          # the APK ships with no artwork and no fonts.
          test -f src/assets/registry.coc.ts || { echo "::error::missing image registries; run 'bun run build:assets' and commit src/assets"; exit 1; }
          test -f android/app/src/main/assets/fonts/Clash-Bold.otf || { echo "::error::missing Android fonts; run 'bun run build:assets' and commit them"; exit 1; }
          echo "images: $(find src/assets/img -name '*.webp' | wc -l), fonts: $(ls android/app/src/main/assets/fonts | wc -l)"

      - name: Type-check and lint
        run: |
          bun run typecheck
          bun run lint

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          chmod +x ./gradlew
          TASK="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          echo "running $TASK"
          # arm64-v8a only. Building all four ABIs roughly quadruples both the
          # build time and the APK size, and every phone worth testing on is
          # arm64.
          ./gradlew "$TASK" \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

      - name: Name the artifact
        id: apk
        run: |
          FILE=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$FILE" || { echo "::error::no APK produced"; exit 1; }
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FILE" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Built $FILE ($(du -h "$FILE" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-board-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
