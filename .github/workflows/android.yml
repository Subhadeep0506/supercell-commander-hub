name: Android APK

on:
  # Every branch, not `[main]`: a name filter builds nothing when the pushed
  # branch does not match, which has already happened here. Releases are still
  # gated to the default branch and tags, in the last step.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        default: release
        options: [release, debug]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN is read-only on repositories created since 2023, so
# publishing a release 403s without this.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Generate API key module
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
        run: |
          {
            echo "COC_API_KEY=${COC_API_KEY}"
            echo "CR_API_KEY=${CR_API_KEY}"
            echo "BS_API_KEY=${BS_API_KEY}"
          } > .env
          bun run keys
          # Without this the APK builds, installs, and fails every request with
          # nothing on screen to say why.
          if ! grep -q 'MISSING_KEYS: string\[\] = \[\]' src/config/keys.ts; then
            echo "::error::API key secrets are not set on this repository. Add COC_API_KEY, CR_API_KEY and BS_API_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Verify bundled artwork is present
        run: |
          # The asset pipeline cannot run here -- its 185 MB of fan-kit packs
          # are not in the repo -- so the committed output must be intact.
          test -f src/assets/registry.coc.ts || { echo "::error::missing image registries; run 'bun run build:assets' and commit src/assets"; exit 1; }
          test -f android/app/src/main/assets/fonts/Clash-Bold.otf || { echo "::error::missing Android fonts; run 'bun run build:assets' and commit them"; exit 1; }
          test -s src/data/clash-book/data-ids.json || { echo "::error::missing src/data/clash-book/data-ids.json; run 'bun run build:data-ids' and commit it"; exit 1; }
          echo "images: $(find src/assets/img -name '*.webp' | wc -l), fonts: $(ls android/app/src/main/assets/fonts | wc -l), data ids: $(grep -c ':' src/data/clash-book/data-ids.json)"

      - name: Type-check and lint
        run: |
          bun run typecheck
          bun run lint

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          chmod +x ./gradlew
          TASK="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          echo "running $TASK"
          # arm64-v8a only: all four ABIs roughly quadruple build time and APK
          # size, and every phone worth testing on is arm64.
          ./gradlew "$TASK" \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

      - name: Name the artifact
        id: apk
        run: |
          FILE=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$FILE" || { echo "::error::no APK produced"; exit 1; }
          mkdir -p dist
          cp "$FILE" dist/clash-board.apk
          echo "path=dist/clash-board.apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FILE" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Built $FILE ($(du -h "$FILE" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-board-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Releases
        id: release
        if: >-
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           github.ref_name == github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Latest build (#{0})', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: ${{ steps.apk.outputs.path }}
          # Defaults to false, which would publish a release with no APK and
          # still pass the job.
          fail_on_unmatched_files: true
          body: |
            Variant: ${{ inputs.variant || 'release' }} · arm64-v8a · ${{ steps.apk.outputs.size }}

            Built from `${{ github.sha }}` by run #${{ github.run_number }}.

            Debug-signed for sideloading. Uninstall any previous copy first if Android refuses the update.

      - name: Link the release
        if: steps.release.outputs.url
        run: |
          echo "APK published: ${{ steps.release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
