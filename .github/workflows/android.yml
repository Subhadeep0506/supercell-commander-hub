name: Android APK

# Builds an installable APK and attaches it to the run, so it can be
# sideloaded and tested on a phone. On mobile data the app reaches the
# RoyaleAPI proxies directly, which is the point: the corporate network this
# is developed on blocks two of the three hosts.

on:
  # Deliberately every branch rather than `[main]`. A branch filter only fires
  # when the pushed branch matches by name, so a repository whose default
  # branch is `master` -- or any work pushed from a side branch -- silently
  # built nothing at all, which is exactly what happened. Releases are still
  # published only from the default branch and tags, see the last step.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        default: release
        options: [release, debug]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Needed to create and update Releases. The default GITHUB_TOKEN is read-only
# on repositories created since 2023, and `gh release create` fails with a 403
# without this.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # React Native 0.88 targets JDK 17; Gradle 9.4 accepts it.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The New Architecture compiles C++ for the codegen'd modules, so the
      # exact NDK named in android/build.gradle has to be present.
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      # keys.ts is generated, never committed: the tokens would otherwise be
      # readable in the repo. They are still extractable from the APK itself --
      # unavoidable without a backend, and accepted when this was planned.
      - name: Generate API key module
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
        run: |
          {
            echo "COC_API_KEY=${COC_API_KEY}"
            echo "CR_API_KEY=${CR_API_KEY}"
            echo "BS_API_KEY=${BS_API_KEY}"
          } > .env
          bun run keys
          # make-keys only warns on an empty token, so a keyless APK builds,
          # installs, and then fails every request with nothing on screen to
          # say why -- the missing-key readout lives on the dev probe screen
          # only. Secrets are per repository and do not follow a repo to a new
          # owner, so this is precisely what breaks after a move.
          if ! grep -q 'MISSING_KEYS: string\[\] = \[\]' src/config/keys.ts; then
            echo "::error::API key secrets are not set on this repository. Add COC_API_KEY, CR_API_KEY and BS_API_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Verify bundled artwork is present
        run: |
          # The asset pipeline cannot run here -- its 185 MB of fan-kit packs
          # are not in the repo -- so the committed output must be intact or
          # the APK ships with no artwork and no fonts.
          test -f src/assets/registry.coc.ts || { echo "::error::missing image registries; run 'bun run build:assets' and commit src/assets"; exit 1; }
          test -f android/app/src/main/assets/fonts/Clash-Bold.otf || { echo "::error::missing Android fonts; run 'bun run build:assets' and commit them"; exit 1; }
          # The village import translates Supercell's numeric data ids through
          # this map. Without it every import resolves to nothing and the
          # Builder Plan silently shows an empty village.
          test -s src/data/clash-book/data-ids.json || { echo "::error::missing src/data/clash-book/data-ids.json; run 'bun run build:data-ids' and commit it"; exit 1; }
          echo "images: $(find src/assets/img -name '*.webp' | wc -l), fonts: $(ls android/app/src/main/assets/fonts | wc -l), data ids: $(grep -c ':' src/data/clash-book/data-ids.json)"

      - name: Type-check and lint
        run: |
          bun run typecheck
          bun run lint

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          chmod +x ./gradlew
          TASK="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          echo "running $TASK"
          # arm64-v8a only. Building all four ABIs roughly quadruples both the
          # build time and the APK size, and every phone worth testing on is
          # arm64.
          ./gradlew "$TASK" \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

      - name: Name the artifact
        id: apk
        run: |
          FILE=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$FILE" || { echo "::error::no APK produced"; exit 1; }
          # Gradle names every build app-release.apk. Renaming here gives the
          # release asset a stable, meaningful download name.
          mkdir -p dist
          cp "$FILE" dist/clash-board.apk
          echo "path=dist/clash-board.apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FILE" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Built $FILE ($(du -h "$FILE" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-board-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Attaching the APK to a Release gives it a permanent, public download
      # link, rather than a run artifact that expires and needs a GitHub login
      # to fetch. Pushing a `v*` tag cuts a real versioned release; every other
      # build on the default branch rolls the `latest` prerelease forward.
      #
      # Skipped on pull requests, and on side branches, so an experiment cannot
      # replace the APK that `latest` is pointing at.
      - name: Publish APK to Releases
        if: >-
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="${GITHUB_REF_NAME}"
            PRERELEASE=""
          else
            TAG="latest"
            TITLE="Latest build (#${{ github.run_number }})"
            PRERELEASE="--prerelease"
            # A rolling tag has to be torn down first: `gh release create`
            # refuses an existing tag, and editing in place would leave the
            # previous APK attached beside the new one.
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          fi
          # Written to a file rather than passed inline: a multi-line string
          # inside this block carries the YAML indentation with it, and the
          # release body renders as a code block.
          {
            echo "Variant: ${{ inputs.variant || 'release' }} · arm64-v8a · ${{ steps.apk.outputs.size }}"
            echo
            echo "Built from \`${GITHUB_SHA}\` by run #${{ github.run_number }}."
            echo
            echo "Debug-signed for sideloading. Uninstall any previous copy first if Android refuses the update."
          } > release-notes.md
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            $PRERELEASE
          echo "Published to release **$TAG**" >> "$GITHUB_STEP_SUMMARY"
